name: Code Review

on:
  pull_request:
    types: [opened, synchronize]  # добавляем типы событий
  issue_comment:                  # добавляем поддержку комментариев
    types: [created]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:                  # добавляем права доступа
      contents: read
      pull-requests: write       # важно для комментирования PR
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4   # обновляем до последней версии

    - name: AI Code Review
      uses: malaev/ai-review@v0.1.25
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        COMMENT_ID: ${{ github.event.comment.id }}
        REPLY_TO_ID: ${{ github.event.comment.in_reply_to_id }}
      with:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # добавляем токен.
